apiVersion: v1
kind: Namespace
metadata:
  name: aquasentinel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aquasentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aquasentinel
  template:
    metadata:
      labels:
        app: aquasentinel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aquasentinel
          image: aquasentinel
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: runtime
              mountPath: /app/runtime
      volumes:
        - name: runtime
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aquasentinel
spec:
  selector:
    app: aquasentinel
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
